<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 13 - Google Fonts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora&family=Open+Sans&family=Sedan&display=swap" rel="stylesheet">
    <style>
        body {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            font-family: 'Sedan', serif;
            font-size: 3em;
        }

        h2 {
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
        }

        p {
            font-family: 'Lora', serif;
            font-size: 1.1em;
            line-height: 1.6em;
        }
    </style>
</head>
<body>
    <h1>Tipografia com Google Fonts</h1>
    <h2>Fontes carregadas pela internet</h2>
    <p>O título usa a fonte Sedan, o subtítulo usa Open Sans e este parágrafo usa Lora.
       As três fontes são carregadas do site fonts.google.com pela tag link no head.</p>
    <p><a href="fontes-baixadas.html">Ver o site com fontes baixadas &gt;&gt;</a></p>
</body>
</html>
